[package]
name = "foundationstereo-rknn"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Rust inference library for Fast-FoundationStereo on Rockchip RK3588 NPU"
repository = "https://github.com/jlu-lujing/fast-foundationstereo-rknn-rust"
documentation = "https://docs.rs/foundationstereo-rknn"
readme = "README.md"
keywords = ["stereo", "rknn", "rk3588", "npu", "depth-estimation"]
categories = ["computer-vision", "hardware-support", "science"]

[features]
serde = ["dep:serde"]

[dependencies]
half = "2"
libloading = "0.9"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[package.metadata.docs.rs]
features = ["serde"]

