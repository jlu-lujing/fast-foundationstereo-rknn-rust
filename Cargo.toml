[package]
name = "foundationstereo-rknn"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Rust inference library for Fast-FoundationStereo on Rockchip RK3588 NPU"
repository = "https://github.com/jlu-lujing/fast-foundationstereo-rknn-rust"
documentation = "https://docs.rs/foundationstereo-rknn"
readme = "README.md"
keywords = ["stereo", "rknn", "rk3588", "npu", "depth-estimation"]
categories = ["computer-vision", "hardware-support", "science"]

[features]
default = ["ort"]
ort = ["dep:ort"]
serde = ["dep:serde"]

[dependencies]
libloading = "0.9"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-19"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
approx = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"

[build-dependencies]
cc = "1"

[package.metadata.docs.rs]
features = ["ort", "serde"]

